# Flink Configuration
# This file contains the configuration for both JobManager and TaskManager

# JobManager settings
jobmanager.rpc.address: flink-jobmanager
jobmanager.rpc.port: 6123
jobmanager.memory.process.size: 1600m

# TaskManager settings
taskmanager.numberOfTaskSlots: 2
taskmanager.memory.process.size: 1728m

# High Availability (optional, for production)
# high-availability: zookeeper
# high-availability.zookeeper.quorum: zookeeper:2181
# high-availability.storageDir: hdfs:///flink/ha/

# Checkpointing and State Backend
state.backend: filesystem
state.checkpoints.dir: file:///opt/flink-data/checkpoints
state.savepoints.dir: file:///opt/flink-data/savepoints

# REST API
rest.port: 8081
rest.address: 0.0.0.0

# Web UI
web.submit.enable: true
web.upload.dir: /opt/flink-data/uploads

# Metrics
metrics.reporter.prom.class: org.apache.flink.metrics.prometheus.PrometheusReporter
metrics.reporter.prom.port: 9249
