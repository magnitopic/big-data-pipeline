services:
  mariadb:
    container_name: mariadb
    build:
        context: ./Docker/mariadb/.
    image: mariadb
    networks:
        - network
    restart: always
    env_file: .env
    ports:
        - "3306:3306"

  nifi:
    container_name: nifi
    build:
        context: ./Docker/nifi/.
    image: nifi
    hostname: nifi
    networks:
        - network
    restart: always
    env_file: .env
    ports:
        - "8443:8443"  # HTTPS UI
        - "8080:8080"  # HTTP UI (if needed)
    environment:
        NIFI_WEB_HTTPS_PORT: 8443
        NIFI_WEB_HTTPS_HOST: 0.0.0.0
        SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME}
        SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD}
        NIFI_JVM_HEAP_INIT: ${NIFI_JVM_HEAP_INIT}
        NIFI_JVM_HEAP_MAX: ${NIFI_JVM_HEAP_MAX}
    volumes:
        - nifi-conf:/opt/nifi/nifi-current/conf
        - nifi-database:/opt/nifi/nifi-current/database_repository
        - nifi-flowfile:/opt/nifi/nifi-current/flowfile_repository
        - nifi-content:/opt/nifi/nifi-current/content_repository
        - nifi-provenance:/opt/nifi/nifi-current/provenance_repository
        - nifi-state:/opt/nifi/nifi-current/state
        - nifi-logs:/opt/nifi/nifi-current/logs
        - ./data:/opt/nifi/data

  mongodb:
    container_name: mongodb
    build:
        context: ./Docker/mongodb/.
    image: mongodb
    hostname: mongodb
    networks:
        - network
    restart: always
    env_file: .env
    ports:
        - "27017:27017"
    environment:
        MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
        MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
        MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-flight_delays}
    volumes:
        - mongodb-data:/data/db
        - mongodb-config:/data/configdb

  kafka:
    container_name: kafka
    build:
        context: ./Docker/kafka/.
    image: kafka
    hostname: kafka
    networks:
        - network
    restart: always
    env_file: .env
    ports:
        - "9092:9092"   # Kafka broker
        - "9093:9093"   # External listener
    environment:
        KAFKA_BROKER_ID: 1
        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
        - kafka-data:/var/lib/kafka/data
    depends_on:
        - zookeeper

  zookeeper:
    container_name: zookeeper
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    networks:
        - network
    restart: always
    ports:
        - "2181:2181"
    environment:
        ZOOKEEPER_CLIENT_PORT: 2181
        ZOOKEEPER_TICK_TIME: 2000
    volumes:
        - zookeeper-data:/var/lib/zookeeper/data
        - zookeeper-logs:/var/lib/zookeeper/log

volumes:
  nifi-conf:
  nifi-database:
  nifi-flowfile:
  nifi-content:
  nifi-provenance:
  nifi-state:
  nifi-logs:
  mongodb-data:
  mongodb-config:
  kafka-data:
  zookeeper-data:
  zookeeper-logs:

networks:
  network:
    name: network
    driver: bridge
